// Conveyor packaging for the Doori desktop app.
//
// WHY THIS EXISTS. `packageDistributionForCurrentOS` already builds a .dmg/.deb/.msi. What it does
// NOT do is give the person who installed it any way to receive the next one. "Builds an installer"
// and "ships software a user can keep" are different problems, and only the first was solved.
// Conveyor adds signing and delta auto-update on top of the same compose.desktop block, so there is
// no second packaging config to keep in sync.
//
// COST: nothing. Conveyor is gratis for "any project released under an OSI-approved license"
// (hydraulic.dev/pricing, checked 2026-08-27). Doori is GPL-3.0, which is OSI-approved. The
// adoption plan flagged pricing as the thing that could kill this trial; it does not.
//
// TO BUILD:  conveyor make site        (needs the Conveyor CLI: `brew install hydraulicdev/tap/conveyor`)
// The Gradle plugin alone cannot produce an installer - it only exports the config below.

// Pulls machine-readable config straight out of the Gradle build: main class, version, and the full
// runtime classpath. Nothing here is duplicated by hand, so a dependency change cannot desync it.
//
// --no-configuration-cache is NOT optional. With Gradle's configuration cache on (this repo enables
// it), the plugin's task fails resolving the runtime classpath:
//     'resolveScriptsForProject' is illegal while in 'Paused' state
// Reproduced on Gradle 9.7.0 / Conveyor plugin 2.0, 2026-08-27. Dropping the flag reintroduces it.
include "#!./gradlew -q :desktopApp:printConveyorConfig --no-configuration-cache"

// Java 21 to match the toolchain the rest of the build compiles against.
include required("/stdlib/jdk/21/openjdk.conf")

app {
  display-name = "Doori"
  fsname = mileway
  rdns-name = "com.mileway.desktop"
  vendor = "Siddharth Pandalai"

  // Where updates are served from. Conveyor writes an update-check URL into the installed app, so
  // this has to be the real download site before a build is distributed to anyone - an installer
  // pointing at a URL that does not exist can never update itself, and the user cannot tell.
  site.base-url = "darkpandawarrior.github.io/Doori/download"

  license = GPL-3.0-or-later

  // Compose Desktop already declares Dmg/Deb/Msi; Conveyor derives the equivalent set from the
  // machine config included above, so the formats are not restated here.
}
