name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      # Disable the daemon in CI, each run gets a fresh environment; daemon lifecycle
      # savings don't apply and it adds overhead from orphaned daemon processes.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # gradle/actions/setup-gradle manages ~/.gradle caching automatically with
      # intelligent eviction. Do NOT add a separate actions/cache for ~/.gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # PRs only read the cache (never write) so they don't pollute the shared cache
          # with their own dependency resolutions; main branch pushes write.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      # Kotlin/Native toolchain (~1 GB) lives outside ~/.gradle and must be cached separately.
      # Key on libs.versions.toml so it invalidates when the Kotlin or KMP version changes.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v1-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleGmsDebug

      # :server is a plain kotlin("jvm") Ktor module, not covered by the app/KMP unit-test
      # tasks that Quality Gate (quality.yml) already runs. Covers route behavior, opId
      # dedup, and PolicyRateEngine against in-memory H2.
      #
      # unit tests (testNoGmsDebugUnitTest), KMP commonTest (testAndroidHostTest), and
      # dependencyGuard are intentionally NOT run here — quality.yml's required "Quality
      # Gate" job already runs these exact tasks on the same push/PR triggers. Running them
      # twice across workflows doubles CI minutes for zero extra signal.
      - name: Run backend server tests
        if: ${{ !cancelled() }}
        run: ./gradlew :server:test

      # :app-web-preview is the wasmJs shell embedded in the portfolio site — the first thing a
      # recruiter runs. Nothing compiled it before, and it carries a hand-maintained srcDir allowlist
      # onto core:ui's theme package, so a rename there breaks it silently.
      - name: Compile the wasmJs portfolio preview
        run: ./gradlew :app-web-preview:wasmJsMainClasses

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/gms/debug/

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    # Cost gate: a minified/shrunk R8 release build is expensive and its only purpose is to
    # catch shrinker-only breakage before it reaches main. Running it on every PR duplicates
    # that cost per-push with no additional signal a PR-time debug build doesn't already give;
    # gate it to pushes on main (post-merge) so PRs stay fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # No signing secrets required: app/build.gradle.kts falls back to the debug key
      # when keystore.properties / RELEASE_* env vars are absent (B.1c), so the minified
      # + shrunk release variant still produces an installable APK in CI.
      - name: Assemble release APK
        run: ./gradlew assembleGmsRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/gms/release/

  # Screenshot baselines are handled by the self-maintaining `Screenshots` workflow
  # (.github/workflows/screenshots.yml): it records them in the CI environment and commits new/changed
  # ones back, instead of failing this pipeline on off-CI rendering drift.

  instrumented-tests:
    name: Instrumented Tests (GMD)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Gradle Managed Devices boot an emulator, which needs hardware acceleration (KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # GMD provisions an AOSP ATD (headless, no Google APIs → the noGms variant), runs the
      # tracking-lifecycle integration test (TrackingLifecycleTest) plus the Room migration
      # androidTests, and tears the device down.
      #
      # Emulator boot on shared runners is intrinsically flaky (AvdSnapshotHandler can fail to create the
      # snapshot for GPU/KVM/timing reasons that vary run-to-run — the same code passes on a re-run). So we:
      #   1. force software GPU (headless runners have no display, so 'auto' can fail to start),
      #   2. retry up to 3x to ride out transient boot failures,
      #   3. on a non-zero exit, trust the per-test JUnit XML over the Gradle exit code — same
      #      approach as scripts/run-jvm-tests.sh. No XML at all means the emulator never got far
      #      enough to run tests (the boot flake this loop exists for) → retry, and tolerate it after
      #      3 attempts. XML with a <failure>/<error> means tests genuinely ran and failed — that's a
      #      real signal (7 of these are Room migration tests) and must gate the build, so no
      #      continue-on-error at the step level: only the boot case exits 0.
      - name: Run instrumented tests on Gradle Managed Device
        run: |
          gpu="-Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect"
          # NOTE: GitHub runs this with `bash -e`, so the gradle call MUST sit inside an `if` —
          # a bare `./gradlew …; code=$?` would abort the whole step on the first non-zero exit and
          # never reach the XML check below.
          for attempt in 1 2 3; do
            echo "::group::GMD attempt $attempt"
            if ./gradlew pixel6Api34noGmsDebugAndroidTest "$gpu"; then
              echo "::endgroup::"; echo "GMD passed on attempt $attempt"; exit 0
            fi
            code=$?
            echo "::endgroup::"

            # Both known AGP output locations — managed-device results land under
            # build/outputs/androidTest-results/, but search the reports tree too so a layout change
            # in a future AGP doesn't silently turn this gate into a no-op.
            xmls=$(find . \( -path '*/build/outputs/androidTest-results/*' -o -path '*/build/reports/androidTests/*' \) -name '*.xml' 2>/dev/null)
            if [ -n "$xmls" ]; then
              real_failures=$(echo "$xmls" | xargs grep -lE '<(failure|error)[ >/]' 2>/dev/null)
              if [ -n "$real_failures" ]; then
                echo "::error title=Real instrumented test failures::gradle exited ${code} and found <failure>/<error> in:"
                echo "$real_failures"
                exit 1
              fi
              echo "GMD attempt $attempt: gradle exited ${code} but no test XML shows a failure; treating as passed"
              exit 0
            fi

            echo "::warning::GMD attempt $attempt produced no androidTest XML (likely emulator boot failure); cleaning up and retrying"
            ./gradlew --stop || true
            sleep 15
          done
          # Boot flakiness is tolerated, as before. But say so LOUDLY: if this fires every run, the
          # find paths above are wrong and this gate is silently passing everything — which is the
          # exact failure mode `continue-on-error: true` had, just better hidden.
          echo "::warning title=GMD did not gate::No androidTest XML after 3 attempts. Tolerating as emulator-boot flakiness. If you see this repeatedly, verify the result paths in this step — the gate may be inert."
          exit 0

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: '**/build/reports/androidTests/'

  # iOS Kotlin/Native compile moved to .github/workflows/ios.yml (macOS runner, path-filtered)
  # so it doesn't run on every PR regardless of whether iOS-relevant sources changed.
