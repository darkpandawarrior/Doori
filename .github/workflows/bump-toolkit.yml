name: Bump kmp-toolkit

# Opens a pin-bump PR when kmp-toolkit's main moves — but ONLY if this app still builds against it.
#
# The naive version of this workflow bumps the pin and opens a PR unconditionally. That is worse
# than doing nothing: it turns a library change into four broken repos on a schedule. The whole
# point here is that the build runs BEFORE the PR exists, so a toolkit change that breaks this app
# produces no PR and a loud failed run instead of a green-looking PR that does not compile.
#
# Triggered by a repository_dispatch from kmp-toolkit (see its notify-consumers.yml), on a weekly
# safety net in case a dispatch is missed, and manually.

on:
  repository_dispatch:
    types: [kmp-toolkit-updated]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-toolkit
  cancel-in-progress: true

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # Push as the PAT, not GITHUB_TOKEN: commits pushed with GITHUB_TOKEN deliberately
          # do NOT trigger workflow runs (GitHub's recursion guard), so every bump PR this
          # workflow opened arrived with "no checks reported" and had to be closed and
          # reopened by hand before CI would run at all.
          #
          # NO `|| github.token` fallback. The reverted first attempt used one and it guarded
          # the wrong failure: it protects an UNSET secret (empty string, falsy) while a WRONG
          # value is truthy and wins. The secret held an unsubstituted placeholder, so the
          # fallback never engaged and checkout died with "could not read Username" in all
          # four repos. A hard reference fails loudly and immediately instead.
          token: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}

      - name: Move both submodules to their upstream main
        id: move
        run: |
          set -eu
          # kmp-toolkit and kmp-build-logic are coupled: the toolkit's convention plugins live in
          # build-logic, so bumping one without the other reliably fails to configure. Always both.
          for m in external/kmp-toolkit external/kmp-build-logic; do
            git -C "$m" fetch --quiet origin main
            git -C "$m" checkout --quiet FETCH_HEAD
          done
          # Sync the three coordinated versions from the toolkit's catalog into ours. Without this
          # the pins move but our own AGP/Kotlin/Compose do not, leaving this app on a different
          # triple to the toolkit it just pinned — and a Gradle composite build requires the
          # included build's plugin versions to agree with the root's, so it would fail to
          # configure every time. The build step below would catch it, but it could never pass.
          for key in agp kotlin compose-multiplatform; do
            want=$(grep -E "^${key} = " external/kmp-toolkit/gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
            have=$(grep -E "^${key} = " gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
            if [ -n "$want" ] && [ "$want" != "$have" ]; then
              sed -i "s|^${key} = \"${have}\"|${key} = \"${want}\"|" gradle/libs.versions.toml
              echo "synced $key: $have -> $want"
            fi
          done
          TK=$(git -C external/kmp-toolkit rev-parse --short HEAD)
          BL=$(git -C external/kmp-build-logic rev-parse --short HEAD)
          echo "toolkit=$TK" >> "$GITHUB_OUTPUT"
          echo "buildlogic=$BL" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- external gradle/libs.versions.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pins already current — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.move.outputs.changed == 'true'
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.move.outputs.changed == 'true'

      - name: Verify this app still builds against the new pins
        if: steps.move.outputs.changed == 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Re-baseline dependency-guard for the new pins
        if: steps.move.outputs.changed == 'true'
        # A toolchain bump routinely shifts transitive coordinates — CMP beta02 -> beta03 moved 56
        # in EACH of this repo's two baselines on 2026-08-05 — and :app:dependencyGuard then fails
        # the bump PR's own quality gate. Two of three family bumps hit this and needed a human to
        # clear it by hand.
        #
        # This does NOT weaken the guard. The regenerated baselines land in the PR as a reviewable
        # diff, which is exactly what the guard is for: make the dependency change visible. What it
        # removes is a CI failure that a human must fix identically every single time.
        #
        # `dependencyGuardBaseline` (not `:app:dependencyGuardBaseline`) regenerates EVERY
        # configured baseline. That matters here: this repo guards both gmsReleaseRuntimeClasspath
        # and noGmsReleaseRuntimeClasspath, and rebaselining only the one named in a failure would
        # leave the FOSS baseline stale — the build F-Droid actually ships.
        run: ./gradlew dependencyGuardBaseline

      - name: Open the pin-bump PR
        if: steps.move.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # app/dependencies is load-bearing: without it the rebaseline above regenerates the
          # files and create-pull-request silently leaves them out of the commit, so the PR still
          # fails dependency-guard and the step above achieves nothing.
          add-paths: |
            external
            gradle/libs.versions.toml
            app/dependencies
          branch: chore/bump-kmp-toolkit
          # Reuse one branch: a fresh PR per toolkit commit would bury the repo in noise.
          # Superseded bumps roll forward into the same PR.
          title: "chore: bump kmp-toolkit to ${{ steps.move.outputs.toolkit }}"
          commit-message: |
            chore: bump kmp-toolkit to ${{ steps.move.outputs.toolkit }}

            Opened automatically after this app was verified to build against the new pins.
            kmp-toolkit ${{ steps.move.outputs.toolkit }}, kmp-build-logic ${{ steps.move.outputs.buildlogic }}.
          body: |
            Automated pin bump, opened **only because the build passed** against the new commits.

            | submodule | now at |
            |---|---|
            | `external/kmp-toolkit` | `${{ steps.move.outputs.toolkit }}` |
            | `external/kmp-build-logic` | `${{ steps.move.outputs.buildlogic }}` |

            Both move together on purpose — the toolkit's convention plugins live in build-logic, so
            bumping one alone reliably fails to configure.

            Verified with `:app:assembleDebug`. If a later toolkit commit breaks this app, no PR appears
            and the workflow run fails instead — the absence of a PR is the signal.
