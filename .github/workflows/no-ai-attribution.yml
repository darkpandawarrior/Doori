name: No AI attribution

# Fails if any commit message introduced by a push or PR carries AI/assistant
# attribution (e.g. "Co-Authored-By: Claude", "🤖 Generated with ..."). Mirrors
# the local .githooks/commit-msg guard so nothing slips through --no-verify or
# a clone that never enabled the hook.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: no-ai-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          PATTERN='co-authored-by:.*(claude|anthropic|openai|copilot|chatgpt)|generated with .{0,4}(claude|copilot|chatgpt|cursor)|🤖 generated'
          if [ "$EVENT" = "pull_request" ]; then
            # NOT --depth=1. A shallow base makes origin/$BASE_REF a single commit, so
            # "origin/$BASE_REF..$PR_HEAD" stops excluding real history and sweeps in commits that
            # are already merged into the base. The push path below already fetches the default
            # branch un-shallowed for exactly this reason; the pull_request path never got the fix.
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            set -- "origin/${BASE_REF}..${PR_HEAD}"
          else
            ZERO=0000000000000000000000000000000000000000
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              # First push of a branch (or a force-push past the old tip): there is no previous tip to
              # diff against. A bare "$AFTER" is NOT that diff — `git log <sha>` walks every ancestor,
              # so this re-scanned the entire repository history on every new branch and failed on
              # commits that were already on the default branch and had nothing to do with the push.
              # Scan only what this branch adds on top of the default branch instead.
              git fetch --no-tags origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
              if [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && git rev-parse --verify -q "origin/${DEFAULT_BRANCH}" >/dev/null; then
                set -- "$AFTER" --not "origin/${DEFAULT_BRANCH}"
              else
                # Pushing the default branch itself for the first time — nothing to exclude, so the
                # full walk is genuinely correct here.
                set -- "$AFTER"
              fi
            else
              set -- "${BEFORE}..${AFTER}"
            fi
          fi
          echo "Scanning commit messages in: $*"
          BAD=$(git log "$@" --format='---%n%H %s%n%b' | grep -niE "$PATTERN" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Commit message(s) contain AI/assistant attribution. Remove it (git commit --amend / rebase) and re-push."
            echo "$BAD"
            exit 1
          fi
          echo "OK — no AI/assistant attribution found."
