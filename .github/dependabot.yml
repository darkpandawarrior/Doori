version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.compose*"]
      androidx:
        patterns: ["androidx.*"]
      room:
        patterns: ["androidx.room*"]
    ignore:
      # AGP must move in LOCKSTEP across three version catalogs that all take part in this
      # composite build:
      #   gradle/libs.versions.toml
      #   external/kmp-toolkit/gradle/libs.versions.toml
      #   external/kmp-build-logic/gradle/libs.versions.toml
      # Gradle's AgpVersionCompatibilityRule hard-fails configuration if they disagree
      # ("Using multiple versions of the Android Gradle plugin ... is not allowed").
      # Dependabot only scans this `directory: "/"`, so any AGP bump it opens updates one
      # catalog, leaves the other two behind, and dies at configuration time — PRs #56 and #66
      # were both closed for exactly that. AGP is bumped BY HAND across all three catalogs.
      #
      # Dependabot reports version-catalog [plugins] entries under their BARE PLUGIN ID, not as
      # `<id>:<id>.gradle.plugin` markers — the marker form was tried first (#62) and did not
      # match, which is how #66 slipped through 26 minutes after that ignore landed. All four
      # coordinates it names must be listed or the grouped PR is still created.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.kotlin.multiplatform.library"
      # ktlint >=13 is a deliberately deferred migration, not a routine bump. Bound is >=13, not
      # >=14: 13.1.0 was measured on 2026-07-27 and churns 108 files / ~950 lines, and ktlintFormat
      # itself FAILS on :core:data (non-auto-fixable rules) — same shape as 14.x, which reformats
      # ~179 files. Zero functional gain either way. Unignore when that migration is scheduled.
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        versions: [">=13"]
      # NOTE: kotlin/ksp/compose-multiplatform are ALSO pinned in the submodule catalogs, but they
      # are deliberately NOT ignored — divergence there is tolerated in practice (compose-multiplatform
      # already differs between Mileway and the toolkit, and a Kotlin 2.4.20-Beta2 bump was verified
      # to build green against Beta1 submodules). Only AGP has a hard compatibility rule.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
