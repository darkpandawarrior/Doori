# Screenshot output, relative to the :app module directory
roborazzi.output.dir=../docs/screenshots

# D2 FIX (2026-08-09). Roborazzi's DEFAULT mode is record, so simply not forcing
# roborazzi.test.record left every surface still overwriting its baseline — a visual regression
# stayed unrepresentable and the suite passed no matter what changed. Proven: corrupting
# widget_glance.png and re-running still gave BUILD SUCCESSFUL.
#
# Verify must therefore be turned ON explicitly. Recording is then the deliberate act:
#   ./gradlew screenshotTest -Proborazzi.test.record=true
roborazzi.test.verify=true
