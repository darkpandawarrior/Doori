name: iosApp
options:
  bundleIdPrefix: com.mileway
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    MTL_FAST_MATH: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
  MilewayWidgetsTests:
    build:
      targets:
        MilewayWidgetsTests: [test]
    test:
      config: Debug
      targets:
        - MilewayWidgetsTests
  MilewayWatch:
    build:
      targets:
        MilewayWatch: all
        MilewayWatchTests: [test]
    test:
      config: Debug
      targets:
        - MilewayWatchTests
  MilewayWidgets:
    build:
      targets:
        MilewayWidgets: all

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        SDKROOT: iphoneos
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mileway.ios
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # embedAndSignAppleFrameworkForXcode writes the slice for the CURRENT build into
        # shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/. One path covers
        # Debug+Release and simulator+device, which is the whole point: the previous setup
        # hardcoded iosSimulatorArm64 in both configs, so `xcodebuild archive` (SDK iphoneos,
        # arch arm64) linked a simulator slice and could not produce a shippable .xcarchive.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # The framework is linked by flag rather than by a project file reference, because a
        # PBXFileReference cannot carry $(CONFIGURATION)/$(SDK_NAME) -- that is what pinned it to
        # one slice before. Same shape as the MilewayWatch target below and as Kursi's iosApp.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Mileway"
    preBuildScripts:
      - name: "Build Kotlin Framework"
        # embedAndSignAppleFrameworkForXcode reads CONFIGURATION, SDK_NAME, ARCHS,
        # TARGET_BUILD_DIR and FRAMEWORKS_FOLDER_PATH from Xcode, links the matching slice, and
        # copies + code-signs it into the app bundle itself. That replaces BOTH the old
        # linkXxxFrameworkIosSimulatorArm64 call and the "Embed Frameworks" copy phase -- keeping
        # the copy phase as well would embed the framework twice.
        script: |
          set -e
          cd "${SRCROOT}/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        outputFiles:
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/Mileway.framework/Mileway"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: MilewayWatch
        embed: true
        codeSignOnCopy: true
      - target: MilewayWidgets
        embed: true
        codeSignOnCopy: true

  MilewayWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MilewayWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        SDKROOT: iphoneos
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mileway.ios.widgets
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MilewayWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: MilewayWidgets/MilewayWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_TESTABILITY: YES

  MilewayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: MilewayWatch
        excludes:
          - Info.plist
      - path: Shared
        excludes:
          # P6.4: ActivityKit is unavailable on watchOS — this file is shared between iosApp and
          # MilewayWidgets (both iOS) only, never the watch target.
          - MilewayActivityAttributes.swift
    settings:
      base:
        # watchos, NOT watchsimulator. Xcode resolves this to watchsimulator automatically for a
        # simulator destination, exactly as the iosApp target's SDKROOT: iphoneos does. Pinning it
        # to watchsimulator meant the watch app -- which iosApp embeds via "Embed Watch Content" --
        # could only ever build against the simulator SDK, so an archive of the parent app could
        # not produce a shippable watch bundle. Same class of bug as the iosSimulatorArm64 pin.
        SDKROOT: watchos
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mileway.ios.watchkitapp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MilewayWatch/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "arm64 arm64_32"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        # P4.7: real icon set generated by tooling/generate_brand_icons.swift, see
        # MilewayWatch/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WKApplication: YES
        WKCompanionAppBundleIdentifier: com.mileway.ios
        WKRunsIndependentlyOfCompanionApp: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sharedWatch/build/bin/watchosCurrent/$(CONFIGURATION)Framework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "SharedWatch"
    preBuildScripts:
      - name: "Build KMP watch framework (lipo)"
        script: |
          set -e
          cd "${SRCROOT}/.."
          # Xcode's ${CONFIGURATION} is "Debug"/"Release" (capitalized), but Kotlin/Native's own
          # framework task output dir is lowerCamelCase ("debugFramework"/"releaseFramework") —
          # KOTLIN_FLAVOR lowercases just the first letter to match Kotlin's actual output path;
          # FLAVOR (unchanged) still names our own DEST dir and the gradle task itself.
          FLAVOR="${CONFIGURATION}Framework"
          KOTLIN_FLAVOR="$(echo "${CONFIGURATION:0:1}" | tr '[:upper:]' '[:lower:]')${CONFIGURATION:1}Framework"
          DEST="sharedWatch/build/bin/watchosCurrent/${FLAVOR}"
          mkdir -p "$DEST"
          if [ "${PLATFORM_NAME}" = "watchsimulator" ]; then
            ./gradlew ":sharedWatch:link${CONFIGURATION}FrameworkWatchosSimulatorArm64"
            rm -rf "$DEST/SharedWatch.framework"
            cp -R "sharedWatch/build/bin/watchosSimulatorArm64/${KOTLIN_FLAVOR}/SharedWatch.framework" "$DEST/SharedWatch.framework"
          else
            ./gradlew ":sharedWatch:link${CONFIGURATION}FrameworkWatchosArm64" ":sharedWatch:link${CONFIGURATION}FrameworkWatchosDeviceArm64"
            rm -rf "$DEST/SharedWatch.framework"
            cp -R "sharedWatch/build/bin/watchosArm64/${KOTLIN_FLAVOR}/SharedWatch.framework" "$DEST/SharedWatch.framework"
            lipo -create \
              "sharedWatch/build/bin/watchosArm64/${KOTLIN_FLAVOR}/SharedWatch.framework/SharedWatch" \
              "sharedWatch/build/bin/watchosDeviceArm64/${KOTLIN_FLAVOR}/SharedWatch.framework/SharedWatch" \
              -output "$DEST/SharedWatch.framework/SharedWatch"
          fi
        basedOnDependencyAnalysis: false

  MilewayWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: MilewayWatchTests
    settings:
      base:
        SDKROOT: watchsimulator
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.mileway.ios.watchkitapp.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ARCHS: "arm64 arm64_32"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sharedWatch/build/bin/watchosCurrent/$(CONFIGURATION)Framework"
    dependencies:
      - target: MilewayWatch

  MilewayWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    # Compile the widget view sources directly (app-extension targets can't be linked into a test
    # bundle). Exclude the @main widget bundle, the Live Activity, and the App Intent.
    sources:
      - path: MilewayWidgetsTests
      - path: MilewayWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
          - MilewayWidgetsBundle.swift
          - TrackingLiveActivity.swift
      - path: Shared
    settings:
      base:
        SDKROOT: iphonesimulator
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.mileway.ios.widgets.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
