config:
  validation: true
  warningsAsErrors: false

# --------------------------------------------------------------------------
# Suppressions: rules that conflict with the project's coding conventions
# or that produce too much noise on auto-generated/preview code.
# --------------------------------------------------------------------------

style:
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true   # named color/size constants (val Foo = Color(0x..)/16.dp) are self-documenting
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '360'
      - '800'
    ignoreAnnotated:
      - 'androidx.compose.ui.tooling.preview.Preview'
      - 'com.mileway.core.ui.previews.PreviewLightDark'
      - 'com.mileway.core.ui.previews.PreviewMatrix'
      - 'com.mileway.core.ui.previews.PreviewFontScales'
      - 'com.mileway.core.ui.previews.PreviewDevices'
      - 'com.mileway.core.ui.previews.PreviewStates'
  MaxLineLength:
    active: false   # ktlint (standard:max-line-length) is the single source of truth for line length
  WildcardImport:
    active: false   # Compose generates many wildcard imports via IDE; suppress project-wide

complexity:
  LongMethod:
    # Generated Compose resource accessors declare 100-line _collectCommonMainString0Resources
    # functions. Nothing we can fix, and their presence is why detektCommonMainSourceSet was never
    # wired into the aggregate `detekt` task — so the gate read nothing at all on KMP modules.
    excludes: ['**/build/generated/**']
    allowedLines: 60   # Compose screens tend to be long but readable
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'   # declarative @Composable trees are long by design
  LongParameterList:
    allowedFunctionParameters: 8   # Composables accept many parameters by design
  CyclomaticComplexMethod:
    allowedComplexity: 15

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false   # runCatching { } is idiomatic in this codebase

naming:
  FunctionNaming:
    # Same generated accessors: `_collectCommonMainString0Resources` cannot match a naming pattern
    # we control.
    excludes:
      - '**/build/generated/**'
      # detekt's own defaults, restored: naming `excludes` REPLACES the default list, so omitting
      # these made every backtick-named test function a violation.
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/iosTest/**'
      - '**/desktopTest/**'
      - '**/wasmJsTest/**'
    ignoreAnnotated:
      - 'androidx.compose.runtime.Composable'
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
